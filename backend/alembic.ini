[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

# Each module keeps its migrations in <module>/infrastructure/migrations/.
# Revisions form ONE linear chain across modules so `alembic upgrade head` keeps working.
# When adding a migration for a module, target its folder explicitly:
#   alembic revision --autogenerate -m "description" --version-path <module>/infrastructure/migrations
version_locations = %(here)s/habits/infrastructure/migrations
path_separator = os

# The database URL is built from environment settings in alembic/env.py (core.config).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
